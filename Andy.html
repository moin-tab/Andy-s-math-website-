  <script>
    /**
     * ============================================================================
     * 數學計算與格式化工具庫 (Math & Formatting Utilities)
     * ============================================================================
     */
    const MathUtils = {
      EPS: 1e-6,

      // Normalize near-zero floating point numbers to avoid "-0.00"
      clean(val, eps = 1e-6) {
        return Math.abs(val) < eps ? 0 : val;
      },

      // Format number to fixed decimals without trailing "-0"
      fmt(val, digits = 2) {
        const c = this.clean(val, Math.pow(10, -digits - 2));
        const s = c.toFixed(digits);
        return s === '-0.00' || s === '-0.0' || s === '-0' ? s.replace('-', '') : s;
      },

      // Format coefficient for algebraic terms (e.g. "+ 3x", "- x", "")
      term(coeff, variable, isFirst = false, digits = 2) {
        const c = this.clean(coeff, 1e-4);
        if (c === 0) return '';
        const absVal = Math.abs(c);
        const sign = c < 0 ? (isFirst ? '-' : ' - ') : (isFirst ? '' : ' + ');
        const numStr = (variable && Math.abs(absVal - 1) < 1e-4) ? '' : this.fmt(absVal, digits);
        return `${sign}${numStr}${variable}`;
      },

      // Format (x - h) or (x + h)
      shiftVar(varName, center, digits = 2) {
        const h = this.clean(center, 1e-4);
        if (h === 0) return varName;
        return h > 0 ? `(${varName} - ${this.fmt(h, digits)})` : `(${varName} + ${this.fmt(Math.abs(h), digits)})`;
      },

      // Format general line equation Ax + By + C = 0
      formatLine(A, B, C, digits = 2) {
        let str = '';
        const tA = this.term(A, 'x', true, digits);
        str += tA;
        const tB = this.term(B, 'y', str === '', digits);
        str += tB;
        const tC = this.term(C, '', str === '', digits);
        str += tC;
        return (str || '0') + ' = 0';
      },

      // Format circle general equation x^2 + y^2 + dx + ey + f = 0
      formatCircleGeneral(d, e, f, digits = 2) {
        let str = 'x^2 + y^2';
        str += this.term(d, 'x', false, digits);
        str += this.term(e, 'y', false, digits);
        str += this.term(f, '', false, digits);
        return str + ' = 0';
      },

      // "a - b"：b 為負時改寫成 "a + |b|"，避免出現 "- -2.0"
      sub(a, b, digits = 2) {
        const bb = this.clean(b, 1e-4);
        return bb < 0
          ? `${this.fmt(a, digits)} + ${this.fmt(-bb, digits)}`
          : `${this.fmt(a, digits)} - ${this.fmt(bb, digits)}`;
      },

      // Distance between two points
      dist(x1, y1, x2, y2) {
        return Math.hypot(x2 - x1, y2 - y1);
      },

      // Intersect infinite line Ax + By + C = 0 with circle (h, k, r)
      intersectLineCircle(A, B, C, h, k, r) {
        const norm2 = A * A + B * B;
        if (norm2 < 1e-10) return [];
        const d0 = (A * h + B * k + C) / Math.sqrt(norm2);
        if (Math.abs(d0) > r + 1e-6) return [];
        // Foot of perpendicular from (h, k) to line
        const val = A * h + B * k + C;
        const fx = h - (A * val) / norm2;
        const fy = k - (B * val) / norm2;
        const chordHalf = Math.sqrt(Math.max(0, r * r - d0 * d0));
        if (chordHalf < 1e-6) return [{ x: fx, y: fy }];
        const ux = -B / Math.sqrt(norm2);
        const uy = A / Math.sqrt(norm2);
        return [
          { x: fx + chordHalf * ux, y: fy + chordHalf * uy },
          { x: fx - chordHalf * ux, y: fy - chordHalf * uy },
        ];
      },

      // Intersect two lines A1 x + B1 y + C1 = 0 and A2 x + B2 y + C2 = 0
      intersectLines(A1, B1, C1, A2, B2, C2) {
        const det = A1 * B2 - A2 * B1;
        if (Math.abs(det) < 1e-8) return null;
        return {
          x: (B1 * C2 - B2 * C1) / det,
          y: (C1 * A2 - C2 * A1) / det,
        };
      },
    };

    /**
     * Safe KaTeX rendering helper
     */
    function renderKaTeX(el, latex, displayMode = true) {
      if (!el) return;
      if (window.katex) {
        try {
          window.katex.render(latex, el, {
            throwOnError: false,
            displayMode,
          });
        } catch (err) {
          el.textContent = latex;
        }
      } else {
        el.textContent = latex;
      }
    }

    /**
     * ============================================================================
     * 2D 座標畫布渲染引擎 (High-DPI Coordinate Canvas Renderer)
     * ============================================================================
     */
    /** 將元素內 $...$ 轉成 KaTeX（取代原本重複 6 次的 regex 區塊） */
    function renderInlineMath(el) {
      if (!el || !window.katex) return;
      const dec = (s) => s.replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');
      el.innerHTML = el.innerHTML.replace(/\$([^$]+)\$/g, (_, tex) => {
        try { return window.katex.renderToString(dec(tex), { throwOnError: false }); } catch (e) { return tex; }
      });
    }

    /** 同步滑桿與其數值標籤（拖曳 / 預設按鈕改動狀態後使用） */
    function syncInput(id, value, labelId, text) {
      const el = document.getElementById(id);
      if (el) el.value = value;
      const lb = labelId && document.getElementById(labelId);
      if (lb) lb.textContent = text !== undefined ? text : value;
    }

    class CoordinateViewport {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.baseScale = 38; // pixels per math unit
        this.zoom = 1.0;
        this.panX = 0;
        this.panY = 0;
        this.width = 0;
        this.height = 0;
        this.dpr = window.devicePixelRatio || 1;
      }

      get scale() {
        return this.baseScale * this.zoom;
      }

      resize() {
        const rect = this.canvas.parentElement.getBoundingClientRect();
        this.width = Math.max(200, rect.width);
        this.height = Math.max(200, rect.height);
        this.dpr = window.devicePixelRatio || 1;
        this.canvas.width = Math.round(this.width * this.dpr);
        this.canvas.height = Math.round(this.height * this.dpr);
        this.ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
        // Adapt baseScale slightly on smaller mobile viewports
        this.baseScale = this.width < 480 ? 28 : 38;
      }

      resetView() {
        this.zoom = 1.0;
        this.panX = 0;
        this.panY = 0;
      }

      toScreen(wx, wy) {
        const cx = this.width / 2 + this.panX;
        const cy = this.height / 2 + this.panY;
        return {
          x: cx + wx * this.scale,
          y: cy - wy * this.scale,
        };
      }

      toWorld(sx, sy) {
        const cx = this.width / 2 + this.panX;
        const cy = this.height / 2 + this.panY;
        return {
          x: (sx - cx) / this.scale,
          y: (cy - sy) / this.scale,
        };
      }

      clear() {
        this.ctx.clearRect(0, 0, this.width, this.height);
        this.ctx.fillStyle = '#080d1a';
        this.ctx.fillRect(0, 0, this.width, this.height);
      }

      drawGrid() {
        const ctx = this.ctx;
        const s = this.scale;
        const topLeft = this.toWorld(0, 0);
        const bottomRight = this.toWorld(this.width, this.height);

        const minX = Math.floor(topLeft.x) - 1;
        const maxX = Math.ceil(bottomRight.x) + 1;
        const minY = Math.floor(bottomRight.y) - 1;
        const maxY = Math.ceil(topLeft.y) + 1;

        const step = s < 20 ? 2 : 1;

        // Grid lines
        for (let x = minX; x <= maxX; x++) {
          const sx = this.toScreen(x, 0).x;
          ctx.beginPath();
          ctx.moveTo(sx, 0);
          ctx.lineTo(sx, this.height);
          ctx.strokeStyle = x === 0 ? 'rgba(148, 163, 184, 0.55)' : (x % 5 === 0 ? 'rgba(51, 65, 85, 0.65)' : 'rgba(30, 41, 59, 0.55)');
          ctx.lineWidth = x === 0 ? 1.5 : 1;
          ctx.stroke();

          if (x !== 0 && x % step === 0) {
            const originY = Math.min(Math.max(this.toScreen(0, 0).y, 14), this.height - 16);
            ctx.fillStyle = '#64748b';
            ctx.font = '11px "JetBrains Mono", monospace';
            ctx.textAlign = 'center';
            ctx.fillText(String(x), sx, originY + 14);
          }
        }

        for (let y = minY; y <= maxY; y++) {
          const sy = this.toScreen(0, y).y;
          ctx.beginPath();
          ctx.moveTo(0, sy);
          ctx.lineTo(this.width, sy);
          ctx.strokeStyle = y === 0 ? 'rgba(148, 163, 184, 0.55)' : (y % 5 === 0 ? 'rgba(51, 65, 85, 0.65)' : 'rgba(30, 41, 59, 0.55)');
          ctx.lineWidth = y === 0 ? 1.5 : 1;
          ctx.stroke();

          if (y !== 0 && y % step === 0) {
            const originX = Math.min(Math.max(this.toScreen(0, 0).x, 22), this.width - 14);
            ctx.fillStyle = '#64748b';
            ctx.font = '11px "JetBrains Mono", monospace';
            ctx.textAlign = 'right';
            ctx.fillText(String(y), originX - 6, sy + 4);
          }
        }

        // Origin label
        const o = this.toScreen(0, 0);
        if (o.x >= 0 && o.x <= this.width && o.y >= 0 && o.y <= this.height) {
          ctx.fillStyle = '#94a3b8';
          ctx.font = '11px "JetBrains Mono", monospace';
          ctx.textAlign = 'right';
          ctx.fillText('O', o.x - 6, o.y + 14);
        }
      }

      drawCircle(h, k, r, options = {}) {
        if (r <= 0 || !isFinite(r)) return;
        const ctx = this.ctx;
        const center = this.toScreen(h, k);
        const radPx = r * this.scale;

        ctx.save();
        ctx.beginPath();
        ctx.arc(center.x, center.y, radPx, 0, Math.PI * 2);
        if (options.fill) {
          ctx.fillStyle = options.fill;
          ctx.fill();
        }
        ctx.strokeStyle = options.color || '#38bdf8';
        ctx.lineWidth = options.lineWidth || 2.2;
        if (options.dashed) ctx.setLineDash([6, 5]);
        ctx.stroke();
        ctx.restore();
      }

      // Draw infinite line Ax + By + C = 0 clipped cleanly across canvas
      drawInfiniteLine(A, B, C, options = {}) {
        const norm = Math.hypot(A, B);
        if (norm < 1e-8) return;
        const ctx = this.ctx;
        const topLeft = this.toWorld(0, 0);
        const bottomRight = this.toWorld(this.width, this.height);
        const pad = 2;
        const xMin = topLeft.x - pad;
        const xMax = bottomRight.x + pad;
        const yMin = bottomRight.y - pad;
        const yMax = topLeft.y + pad;

        let p1, p2;
        if (Math.abs(B) > Math.abs(A)) {
          p1 = this.toScreen(xMin, (-C - A * xMin) / B);
          p2 = this.toScreen(xMax, (-C - A * xMax) / B);
        } else {
          p1 = this.toScreen((-C - B * yMin) / A, yMin);
          p2 = this.toScreen((-C - B * yMax) / A, yMax);
        }

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.strokeStyle = options.color || '#34d399';
        ctx.lineWidth = options.lineWidth || 2.4;
        if (options.dashed) ctx.setLineDash(options.dashPattern || [7, 5]);
        ctx.stroke();
        ctx.restore();

        if (options.label) {
          // Place label neatly along visible segment
          const midX = (p1.x + p2.x) * 0.5;
          const midY = (p1.y + p2.y) * 0.5;
          this.drawBadgeText(options.label, midX + 10, midY - 10, options.color || '#34d399');
        }
      }

      drawSegment(x1, y1, x2, y2, options = {}) {
        const ctx = this.ctx;
        const p1 = this.toScreen(x1, y1);
        const p2 = this.toScreen(x2, y2);
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.strokeStyle = options.color || '#fbbf24';
        ctx.lineWidth = options.lineWidth || 2;
        if (options.dashed) ctx.setLineDash(options.dashPattern || [5, 4]);
        ctx.stroke();
        ctx.restore();

        if (options.label) {
          const mx = (p1.x + p2.x) / 2;
          const my = (p1.y + p2.y) / 2;
          this.drawBadgeText(options.label, mx + (options.labelOffsetX || 6), my + (options.labelOffsetY || -8), options.color || '#fbbf24');
        }
      }

      drawRightAngle(vx, vy, p1x, p1y, p2x, p2y, sizePx = 11, color = '#94a3b8') {
        const v = this.toScreen(vx, vy);
        const s1 = this.toScreen(p1x, p1y);
        const s2 = this.toScreen(p2x, p2y);
        const d1 = Math.hypot(s1.x - v.x, s1.y - v.y);
        const d2 = Math.hypot(s2.x - v.x, s2.y - v.y);
        if (d1 < 1e-4 || d2 < 1e-4) return;
        const u1x = ((s1.x - v.x) / d1) * sizePx;
        const u1y = ((s1.y - v.y) / d1) * sizePx;
        const u2x = ((s2.x - v.x) / d2) * sizePx;
        const u2y = ((s2.y - v.y) / d2) * sizePx;

        const ctx = this.ctx;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(v.x + u1x, v.y + u1y);
        ctx.lineTo(v.x + u1x + u2x, v.y + u1y + u2y);
        ctx.lineTo(v.x + u2x, v.y + u2y);
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.restore();
      }

      drawPoint(wx, wy, options = {}) {
        const ctx = this.ctx;
        const p = this.toScreen(wx, wy);
        const color = options.color || '#38bdf8';
        const r = options.radius || (options.draggable ? 6.5 : 4.5);

        ctx.save();
        if (options.draggable) {
          // Outer interactive halo
          ctx.beginPath();
          ctx.arc(p.x, p.y, r + 7, 0, Math.PI * 2);
          ctx.fillStyle = options.haloColor || 'rgba(56, 189, 248, 0.22)';
          ctx.fill();
        }
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.fill();
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#0f172a';
        ctx.stroke();
        ctx.restore();

        if (options.label) {
          ctx.save();
          ctx.font = 'bold 12px "Noto Sans TC", "JetBrains Mono", sans-serif';
          ctx.textAlign = 'left'; // drawGrid 會把 textAlign 留在 right，必須重設
          const ox = options.offsetX !== undefined ? options.offsetX : 10;
          const oy = options.offsetY !== undefined ? options.offsetY : -10;
          // Subtle dark backing for high legibility
          const textWidth = ctx.measureText(options.label).width;
          ctx.fillStyle = 'rgba(8, 13, 26, 0.78)';
          ctx.fillRect(p.x + ox - 3, p.y + oy - 12, textWidth + 6, 16);
          ctx.fillStyle = color;
          ctx.fillText(options.label, p.x + ox, p.y + oy);
          ctx.restore();
        }
      }

      drawBadgeText(text, sx, sy, color = '#e2e8f0') {
        const ctx = this.ctx;
        ctx.save();
        ctx.font = '600 11px "Noto Sans TC", "JetBrains Mono", sans-serif';
        ctx.textAlign = 'left';
        const w = ctx.measureText(text).width;
        const cx = Math.min(Math.max(sx, 8), this.width - w - 12);
        const cy = Math.min(Math.max(sy, 18), this.height - 8);
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(cx - 4, cy - 12, w + 8, 17, 4); else ctx.rect(cx - 4, cy - 12, w + 8, 17);
        ctx.fill();
        ctx.fillStyle = color;
        ctx.fillText(text, cx, cy);
        ctx.restore();
      }
    }

        render(vp) {

          vp.drawInfiniteLine(1, 0, -(h + r), { color: 'rgba(244, 63, 94, 0.22)', dashed: true, dashPattern: [4, 6], lineWidth: 1.2 });

          const Am = MathUtils.clean((h - px) ** 2 - r * r, 1e-4);
          const Bm = MathUtils.clean(-2 * (h - px) * (k - py), 1e-4);
          const Cm = MathUtils.clean((k - py) ** 2 - r * r, 1e-4);

              });

              if (Math.abs(Bm) > 1e-6) {
                const m1 = -Cm / Bm;
                // Line: m1(x - px) - (y - py) = 0
                vp.drawInfiniteLine(m1, -1, py - m1 * px, {

          quadStr += MathUtils.term(Cm, '', quadStr === '', 2);
          quadStr = (quadStr || '0') + ' = 0';

          let rootTex = '';

              rootTex = `\\text{退化一次式解：} m_1 = ${MathUtils.fmt(m1, 3)} \\quad ; \\quad \\color{#fb7185}{\\text{補回鉛直線 } x = ${MathUtils.fmt(px, 1)}}`;
            } else {
              const disc = Math.max(0, Bm * Bm - 4 * Am * Cm);
              const m1 = (-Bm + Math.sqrt(disc)) / (2 * Am);
              const m2 = (-Bm - Math.sqrt(disc)) / (2 * Am);
              rootTex = `m_1 = ${MathUtils.fmt(m1, 3)} \\quad , \\quad m_2 = ${MathUtils.fmt(m2, 3)}`;
            }
          } else {

            <div class="p-3 rounded-xl bg-slate-950/80 border border-slate-800">

              <div class="text-xs text-sky-300 font-semibold mb-1">3. 切線斜率與方程式結論：</div>

          renderKaTeX(document.getElementById('m2-tex-1'), `\\left[(h - x_0)^2 - r^2\\right]m^2 - 2(h - x_0)(k - y_0)m + \\left[(k - y_0)^2 - r^2\\right] = 0`);
          renderKaTeX(document.getElementById('m2-tex-2'), quadStr);
          renderKaTeX(document.getElementById('m2-tex-3'), rootTex);

            <p>• <strong>秒殺檢驗法</strong>：過圓外一點作切線<strong>必定有兩條</strong>！若用點斜式解出的 $m$ 只有一個值（代表 $m^2$ 係數為 $0$），不需重算，直接補上 $x = x_0$ 即為第二條切線。</p>

          renderInlineMath(document.getElementById('concept-notes'));

      // --------------------------------------------------------------------------
      // 模組三：圓系方程式與根軸（Radical Axis）
      // --------------------------------------------------------------------------
      {
        id: 3,
        shortTitle: '03 圓系與根軸',
        fullTitle: '圓系方程式 C₁ + kC₂ = 0 與根軸（Radical Axis）',
        hint: '調整 k 值觀察圓系動態變化；設為 k = -1 即可消去二次項得到根軸，並可拖曳根軸動點 P 驗證等切線長！',
        defaultState() {
          return {
            h1: -2, k1: 0, r1: 3,
            h2: 2.5, k2: 0.5, r2: 2.5,
            k: 0.5,
            tP: 2.2, // parameter along radical axis
          };
        },
        state: null,
        init() {
          this.state = this.defaultState();
        },
        reset() {
          this.state = this.defaultState();
        },
        getRadicalAxis() {
          const { h1, k1, r1, h2, k2, r2 } = this.state;
          const d1 = -2 * h1, e1 = -2 * k1, f1 = h1 * h1 + k1 * k1 - r1 * r1;
          const d2 = -2 * h2, e2 = -2 * k2, f2 = h2 * h2 + k2 * k2 - r2 * r2;
          return {
            A: d1 - d2,
            B: e1 - e2,
            C: f1 - f2,
            d1, e1, f1, d2, e2, f2,
          };
        },
        getPointPOnAxis() {
          const { A, B, C } = this.getRadicalAxis();
          const norm = Math.hypot(A, B);
          if (norm < 1e-6) return { x: 0, y: 0 };
          // Base point on axis closest to origin
          const x0 = (-A * C) / (norm * norm);
          const y0 = (-B * C) / (norm * norm);
          const ux = -B / norm;
          const uy = A / norm;
          return {
            x: x0 + this.state.tP * ux,
            y: y0 + this.state.tP * uy,
          };
        },
        getDraggablePoints() {
          const pts = [
            { id: 'O1', x: this.state.h1, y: this.state.k1 },
            { id: 'O2', x: this.state.h2, y: this.state.k2 },
          ];
          if (Math.abs(this.state.k + 1) < 1e-4) {
            const p = this.getPointPOnAxis();
            pts.push({ id: 'P', x: p.x, y: p.y });
          }
          return pts;
        },
        onDragPoint(id, wx, wy) {
          if (id === 'O1') {
            this.state.h1 = Math.round(wx * 10) / 10;
            this.state.k1 = Math.round(wy * 10) / 10;
          } else if (id === 'O2') {
            this.state.h2 = Math.round(wx * 10) / 10;
            this.state.k2 = Math.round(wy * 10) / 10;
          } else if (id === 'P') {
            const { A, B, C } = this.getRadicalAxis();
            const norm = Math.hypot(A, B);
            if (norm > 1e-6) {
              const x0 = (-A * C) / (norm * norm);
              const y0 = (-B * C) / (norm * norm);
              const ux = -B / norm;
              const uy = A / norm;
              this.state.tP = Math.max(-7, Math.min(7, (wx - x0) * ux + (wy - y0) * uy));
            }
          }
        },
        renderControls(container, onUpdate) {
          const s = this.state;
          container.innerHTML = `
            <div class="p-3 rounded-xl bg-slate-950/70 border border-slate-800 space-y-2">

          const kSlider = document.getElementById('m3-k');
          const syncAll = () => {

          kSlider.addEventListener('input', (e) => {

            this.state.k = -1;
            this.state.tP = 2.5;
            syncAll();
            onUpdate();
          });
        },
        render(vp) {
          const { h1, k1, r1, h2, k2, r2, k } = this.state;
          vp.clear();
          vp.drawGrid();

          // Draw C1 and C2
          vp.drawCircle(h1, k1, r1, { color: '#38bdf8', fill: 'rgba(56, 189, 248, 0.05)', lineWidth: 2.2 });
          vp.drawCircle(h2, k2, r2, { color: '#818cf8', fill: 'rgba(129, 140, 248, 0.05)', lineWidth: 2.2 });

          const rad = this.getRadicalAxis();
          const legendEl = document.getElementById('canvas-legend');

          if (Math.abs(k + 1) < 1e-4) {
            // k = -1 -> Radical Axis
            vp.drawInfiniteLine(rad.A, rad.B, rad.C, {
              color: '#34d399',
              lineWidth: 2.8,
              label: '根軸 (k = -1)',
            });

            // Movable point P on radical axis -> equal tangent lengths
            const P = this.getPointPOnAxis();
            const d1 = MathUtils.dist(P.x, P.y, h1, k1);
            const d2 = MathUtils.dist(P.x, P.y, h2, k2);
            if (d1 > r1 + 0.05 && d2 > r2 + 0.05) {
              const ang1 = Math.atan2(P.y - k1, P.x - h1);
              const beta1 = Math.acos(r1 / d1);
              const t1 = { x: h1 + r1 * Math.cos(ang1 + beta1), y: k1 + r1 * Math.sin(ang1 + beta1) };

              const ang2 = Math.atan2(P.y - k2, P.x - h2);
              const beta2 = Math.acos(r2 / d2);
              const t2 = { x: h2 + r2 * Math.cos(ang2 - beta2), y: k2 + r2 * Math.sin(ang2 - beta2) };

              const L2 = Math.sqrt(d2 * d2 - r2 * r2);

              vp.drawSegment(P.x, P.y, t1.x, t1.y, { color: '#fbbf24', dashed: true, lineWidth: 2, label: `L₁=${MathUtils.fmt(L1, 2)}` });
              vp.drawSegment(P.x, P.y, t2.x, t2.y, { color: '#f472b6', dashed: true, lineWidth: 2, label: `L₂=${MathUtils.fmt(L2, 2)}` });
              vp.drawPoint(t1.x, t1.y, { color: '#fbbf24', radius: 4 });
              vp.drawPoint(t2.x, t2.y, { color: '#f472b6', radius: 4 });

              color: '#34d399',

              label: `根軸動點 P(${MathUtils.fmt(P.x, 1)}, ${MathUtils.fmt(P.y, 1)})`,

            legendEl.innerHTML = `
              <span class="px-2 py-0.5 rounded bg-slate-900/90 border border-emerald-500/40 text-emerald-300">━━ 綠色實線：根軸（k = -1 時曲率歸零為直線，且恆垂直於連心線 O₁O₂）</span>

            `;
          } else {
            // Family Circle C1 + k C2 = 0
            // 根軸（k = -1）一律畫出，方便對照圓系
            if (Math.hypot(rad.A, rad.B) > 1e-6) {
              vp.drawInfiniteLine(rad.A, rad.B, rad.C, { color: '#34d399', lineWidth: 2.2, label: '根軸 (k = -1)' });
            }
            const denom = 1 + k;
            const hk = -(rad.d1 + k * rad.d2) / (2 * denom);
            const kk = -(rad.e1 + k * rad.e2) / (2 * denom);
            const fk = (rad.f1 + k * rad.f2) / denom;
            const rk2 = hk * hk + kk * kk - fk;

            if (rk2 > 0) {
              const rk = Math.sqrt(rk2);
              vp.drawCircle(hk, kk, rk, {
                color: '#fbbf24',
                fill: 'rgba(251, 191, 36, 0.08)',
                lineWidth: 2.6,
              });
              vp.drawPoint(hk, kk, { color: '#fbbf24', radius: 4, label: `圓系圓心` });
            }

            legendEl.innerHTML = `
              <span class="px-2 py-0.5 rounded bg-slate-900/90 border border-sky-500/40 text-sky-300">━━ 藍圓 C₁</span>

              <span class="px-2 py-0.5 rounded bg-slate-900/90 border border-amber-500/40 text-amber-300">━━ 黃圓：圓系 C₁ + (${k.toFixed(2)})C₂ = 0</span>
            `;
          }

          vp.drawPoint(h1, k1, { color: '#38bdf8', draggable: true, label: 'O₁', offsetY: 16 });
          vp.drawPoint(h2, k2, { color: '#818cf8', draggable: true, label: 'O₂', offsetY: 16 });
        },
        updateDashboard() {
          const { h1, k1, r1, h2, k2, r2, k } = this.state;
          const rad = this.getRadicalAxis();
          const isRad = Math.abs(k + 1) < 1e-4;

          }

          let rk2 = 0;
          if (!isRad) {
            const denom = 1 + k;
            const hk = -(rad.d1 + k * rad.d2) / (2 * denom);
            const kk = -(rad.e1 + k * rad.e2) / (2 * denom);
            const fk = (rad.f1 + k * rad.f2) / denom;

          if (isRad) {

          const P = this.getPointPOnAxis();

              <div class="text-sm font-mono font-bold text-emerald-300 mt-0.5">${

          renderKaTeX(

            `\\begin{aligned} C_1 &: ${MathUtils.formatCircleGeneral(rad.d1, rad.e1, rad.f1, 1)} \\\\ C_2 &: ${MathUtils.formatCircleGeneral(rad.d2, rad.e2, rad.f2, 1)} \\end{aligned}`
          );
          renderKaTeX(document.getElementById('m3-tex-2'), MathUtils.formatLine(rad.A, rad.B, rad.C, 1));

          document.getElementById('concept-notes').innerHTML = `
            <p>• <strong>圓系缺憾原則</strong>：$C_1 + kC_2 = 0$ 可表示所有過兩圓交點的圓，但<strong>唯獨無法表示 $C_2$ 本身</strong>（因為 $k$ 無論多大都無法把 $C_1$ 係數消為 $0$）。</p>
            <p>• <strong>根軸（等切線長軌跡）</strong>：當 $k = -1$ 時消去 $x^2 + y^2$，無論兩圓是否相交，所得直線上的任一點（在圓外時）對兩圓所作<strong>切線段長必相等</strong>。</p>
          `;
          renderInlineMath(document.getElementById('concept-notes'));
        },
      },

      // --------------------------------------------------------------------------
      // 模組四：兩圓位置關係與內、外公切線段長
      // --------------------------------------------------------------------------
      {
        id: 4,
        shortTitle: '04 兩圓公切線',
        fullTitle: '兩圓位置關係與內、外公切線段長',
        hint: '拖曳兩圓心 O₁, O₂ 改變連心線距離 d，並開啟輔助直角三角形觀察畢氏定理構造！',
        defaultState() {

        getDraggablePoints() {

        renderControls(container, onUpdate) {

            <div class="grid grid-cols-2 gap-3">

            <div class="flex flex-wrap gap-1.5">

              <button data-preset="intersect" class="m4-preset px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 border border-slate-700">相交 (2條)</button>
              <button data-preset="int-tan" class="m4-preset px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 border border-slate-700">內切 (1條)</button>
              <button data-preset="inside" class="m4-preset px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs text-slate-200 border border-slate-700">內含 (0條)</button>

          ['r1', 'r2'].forEach((key) => {
            document.getElementById(`m4-${key}`).addEventListener('input', (e) => {

          document.getElementById('m4-helper').addEventListener('change', (e) => {

          document.getElementById('m4-radical').addEventListener('change', (e) => {
            this.state.showRadical = e.target.checked;
            onUpdate();
          });

          document.querySelectorAll('.m4-preset').forEach((btn) => {
            btn.addEventListener('click', () => {
              const p = btn.dataset.preset;
              // r₁ = r₂ 時不可能內切 / 內含，自動把 r₂ 調小 1
              if ((p === 'int-tan' || p === 'inside') && Math.abs(this.state.r1 - this.state.r2) < 1e-9) {
                this.state.r2 = Math.max(0.5, this.state.r1 - 1);
                syncInput('m4-r2', this.state.r2, 'm4-val-r2');
              }
              const { r1, r2 } = this.state;
              this.state.k1 = 0;
              this.state.k2 = 0;
              let targetD = r1 + r2 + 2;
              if (p === 'ext-tan') targetD = r1 + r2;
              else if (p === 'intersect') targetD = (r1 + r2 + Math.abs(r1 - r2)) / 2;
              else if (p === 'int-tan') targetD = Math.abs(r1 - r2) || 0.5;
              else if (p === 'inside') targetD = Math.max(0.4, Math.abs(r1 - r2) * 0.45);
              this.state.h1 = -targetD / 2;
              this.state.h2 = targetD / 2;
              onUpdate();
            });

        },
        // 回傳所有公切線：{ type, len, m（鉛直時為 null）, eq }
        // 根軸 Ax + By + C = 0（兩圓同心時不存在）
        getRadical() {
          const { h1, k1, r1, h2, k2, r2 } = this.state;
          const A = -2 * (h1 - h2), B = -2 * (k1 - k2);
          if (Math.hypot(A, B) < 1e-6) return null;
          return { A, B, C: h1 * h1 + k1 * k1 - r1 * r1 - (h2 * h2 + k2 * k2 - r2 * r2) };
        },
        getTangents() {
          const { h1, k1, r1, h2, k2, r2 } = this.state;
          const d = MathUtils.dist(h1, k1, h2, k2);
          if (d < 1e-3) return [];
          const ux = (h2 - h1) / d, uy = (k2 - k1) / d, nx = -uy, ny = ux;
          const list = [];
          const add = (type, vx, vy, c, len) => {
            const m = Math.abs(vy) < 1e-6 ? null : -vx / vy;
            const eq = m === null ? `x = ${MathUtils.fmt(c / vx, 2)}` : `y = ${MathUtils.fmt(m, 2)}x ${c / vy < 0 ? '-' : '+'} ${MathUtils.fmt(Math.abs(c / vy), 2)}`;
            list.push({ type, len, m, eq });
          };
          if (d >= Math.abs(r1 - r2) - 1e-3) {
            const cosA = Math.max(-1, Math.min(1, (r1 - r2) / d));
            const sinA = Math.sqrt(Math.max(0, 1 - cosA * cosA));
            const len = Math.sqrt(Math.max(0, d * d - (r1 - r2) ** 2));
            [1, -1].forEach((s, i) => {
              if (sinA < 0.03 && i === 1) return;
              const vx = cosA * ux + s * sinA * nx, vy = cosA * uy + s * sinA * ny;
              add('外', vx, vy, vx * (h1 + r1 * vx) + vy * (k1 + r1 * vy), len);
            });
          }
          if (d >= r1 + r2 - 1e-3) {
            const cosB = Math.max(-1, Math.min(1, (r1 + r2) / d));
            const sinB = Math.sqrt(Math.max(0, 1 - cosB * cosB));
            const len = Math.sqrt(Math.max(0, d * d - (r1 + r2) ** 2));
            [1, -1].forEach((s, i) => {
              if (sinB < 0.03 && i === 1) return;
              const wx = cosB * ux + s * sinB * nx, wy = cosB * uy + s * sinB * ny;
              add('內', wx, wy, wx * (h1 + r1 * wx) + wy * (k1 + r1 * wy), len);
            });
          }
          return list;
        },
        render(vp) {
          const { h1, k1, r1, h2, k2, r2, showHelper, showRadical } = this.state;
          vp.clear();
          vp.drawGrid();

          vp.drawCircle(h1, k1, r1, { color: '#38bdf8', fill: 'rgba(56, 189, 248, 0.06)', lineWidth: 2.4 });
          vp.drawCircle(h2, k2, r2, { color: '#818cf8', fill: 'rgba(129, 140, 248, 0.06)', lineWidth: 2.4 });

          // 根軸：C₁ − C₂ = 0，恆垂直於連心線
          if (showRadical) {
            const ra = this.getRadical();
            if (ra) vp.drawInfiniteLine(ra.A, ra.B, ra.C, { color: '#c084fc', lineWidth: 2.2, label: '根軸' });
          }

          // Line of centers O1O2
          const d = MathUtils.dist(h1, k1, h2, k2);
          vp.drawSegment(h1, k1, h2, k2, { color: 'rgba(148, 163, 184, 0.5)', lineWidth: 1.2, label: `d = ${MathUtils.fmt(d, 2)}`, labelOffsetY: 14 });

          if (d > 1e-4) {
            const ux = (h2 - h1) / d;
            const uy = (k2 - k1) / d;
            const nx = -uy;
            const ny = ux;

            // 1. External Common Tangents (exist when d >= |r1 - r2|)
            if (d >= Math.abs(r1 - r2) - 1e-3) {
              const cosA = Math.max(-1, Math.min(1, (r1 - r2) / d));
              const sinA = Math.sqrt(Math.max(0, 1 - cosA * cosA));
              [1, -1].forEach((sign, idx) => {
                if (sinA < 0.03 && idx === 1) return; // single tangent when internal tangent
                const vx = cosA * ux + sign * sinA * nx;
                const vy = cosA * uy + sign * sinA * ny;
                const t1x = h1 + r1 * vx, t1y = k1 + r1 * vy;
                const t2x = h2 + r2 * vx, t2y = k2 + r2 * vy;
                // Highlight segment T1T2
                vp.drawSegment(t1x, t1y, t2x, t2y, { color: '#34d399', lineWidth: 2.8, label: `外${idx + 1}｜L=${MathUtils.fmt(Math.sqrt(Math.max(0, d * d - (r1 - r2) ** 2)), 2)}｜${Math.abs(vy) < 1e-6 ? 'x=定值' : 'm=' + MathUtils.fmt(-vx / vy, 2)}`, labelOffsetY: idx === 0 ? -10 : 18 });
                vp.drawPoint(t1x, t1y, { color: '#34d399', radius: 3.8 });
                vp.drawPoint(t2x, t2y, { color: '#34d399', radius: 3.8 });

                // Helper Right Triangle on upper tangent (sign === 1)
                if (showHelper && idx === 0 && sinA > 1e-3) {
                  if (r1 >= r2) {
                    const hx = h1 + (r1 - r2) * vx;
                    const hy = k1 + (r1 - r2) * vy;
                    vp.drawSegment(h2, k2, hx, hy, { color: '#34d399', lineWidth: 2, label: `外公切=${MathUtils.fmt(Math.sqrt(Math.max(0, d * d - (r1 - r2) ** 2)), 2)}`, labelOffsetY: -12 });
                    vp.drawSegment(h1, k1, hx, hy, { color: '#38bdf8', lineWidth: 2, label: `|r₁-r₂|=${MathUtils.fmt(Math.abs(r1 - r2), 1)}`, labelOffsetX: -48 });
                    vp.drawRightAngle(hx, hy, h1, k1, h2, k2, 10, '#34d399');
                  } else {
                    const hx = h2 + (r2 - r1) * vx;
                    const hy = k2 + (r2 - r1) * vy;
                    vp.drawSegment(h1, k1, hx, hy, { color: '#34d399', lineWidth: 2 });
                    vp.drawSegment(h2, k2, hx, hy, { color: '#818cf8', lineWidth: 2 });
                    vp.drawRightAngle(hx, hy, h2, k2, h1, k1, 10, '#34d399');
                  }
                }
              });
            }

            // 2. Internal Common Tangents (exist when d >= r1 + r2)
            if (d >= r1 + r2 - 1e-3) {
              const cosB = Math.max(-1, Math.min(1, (r1 + r2) / d));
              const sinB = Math.sqrt(Math.max(0, 1 - cosB * cosB));
              [1, -1].forEach((sign, idx) => {
                if (sinB < 0.03 && idx === 1) return;
                const wx = cosB * ux + sign * sinB * nx;
                const wy = cosB * uy + sign * sinB * ny;
                const s1x = h1 + r1 * wx, s1y = k1 + r1 * wy;
                const s2x = h2 - r2 * wx, s2y = k2 - r2 * wy;
                vp.drawSegment(s1x, s1y, s2x, s2y, { color: '#fbbf24', lineWidth: 2.8, label: `內${idx + 1}｜L=${MathUtils.fmt(Math.sqrt(Math.max(0, d * d - (r1 + r2) ** 2)), 2)}｜${Math.abs(wy) < 1e-6 ? 'x=定值' : 'm=' + MathUtils.fmt(-wx / wy, 2)}`, labelOffsetY: idx === 0 ? -10 : 18 });
                vp.drawPoint(s1x, s1y, { color: '#fbbf24', radius: 3.8 });
                vp.drawPoint(s2x, s2y, { color: '#fbbf24', radius: 3.8 });

                // Helper Right Triangle on first internal tangent (sign === 1)
                if (showHelper && idx === 0 && sinB > 1e-3) {
                  const hx = h1 + (r1 + r2) * wx;
                  const hy = k1 + (r1 + r2) * wy;
                  vp.drawSegment(s1x, s1y, hx, hy, { color: '#fbbf24', lineWidth: 1.8 });
                  vp.drawSegment(h2, k2, hx, hy, { color: '#fbbf24', lineWidth: 2, label: `內公切=${MathUtils.fmt(Math.sqrt(Math.max(0, d * d - (r1 + r2) ** 2)), 2)}`, labelOffsetY: 16 });
                  vp.drawRightAngle(hx, hy, h1, k1, h2, k2, 10, '#fbbf24');
                }
              });
            }
          }

          vp.drawPoint(h1, k1, { color: '#38bdf8', draggable: true, label: 'O₁', offsetY: 16 });
          vp.drawPoint(h2, k2, { color: '#818cf8', draggable: true, label: 'O₂', offsetY: 16 });

          document.getElementById('canvas-legend').innerHTML = `
            <span class="px-2 py-0.5 rounded bg-slate-900/90 border border-emerald-500/40 text-emerald-300">━━ 綠色線段：外公切線段長</span>
            <span class="px-2 py-0.5 rounded bg-slate-900/90 border border-amber-500/40 text-amber-300">━━ 黃色線段：內公切線段長</span>
            <span class="px-2 py-0.5 rounded bg-slate-900/90 border border-purple-500/40 text-purple-300">━━ 紫色直線：根軸</span>
          `;
        },
        updateDashboard() {
          const { h1, k1, r1, h2, k2, r2 } = this.state;
          const d = MathUtils.dist(h1, k1, h2, k2);
          const sumR = r1 + r2;
          const diffR = Math.abs(r1 - r2);

          let relation = '';
          let tanCount = '';
          if (d < 1e-3 && diffR < 1e-3) {
            relation = '兩圓重合 (同心且 r₁ = r₂)';
            tanCount = '無限多條（重合）';
          } else if (d > sumR + 1e-3) {
            relation = '兩圓外離 (d > r₁ + r₂)';
            tanCount = '4 條（2 外 2 內）';
          } else if (Math.abs(d - sumR) <= 1e-3) {
            relation = '兩圓外切 (d = r₁ + r₂)';
            tanCount = '3 條（2 外 1 內）';
          } else if (d > diffR + 1e-3) {
            relation = '相交於兩點 (|r₁ - r₂| < d < r₁ + r₂)';
            tanCount = '2 條（2 外 0 內）';
          } else if (Math.abs(d - diffR) <= 1e-3 && d > 0.02) {
            relation = '兩圓內切 (d = |r₁ - r₂|)';

          statusPill.textContent = relation;
          document.getElementById('alert-banner').classList.add('hidden');

          const extLen = d >= diffR - 1e-4 ? MathUtils.fmt(Math.sqrt(Math.max(0, d * d - diffR * diffR)), 2) : '不存在';
          const intLen = d >= sumR - 1e-4 ? MathUtils.fmt(Math.sqrt(Math.max(0, d * d - sumR * sumR)), 2) : '不存在';

          document.getElementById('metrics-grid').innerHTML = `
            <div class="p-2.5 rounded-xl bg-slate-800/70 border border-slate-700/70">
              <div class="text-xs text-slate-400">連心線長 d / 公切線數</div>
              <div class="text-sm font-mono font-bold text-white mt-0.5">d = ${MathUtils.fmt(d, 2)}（${tanCount}）</div>
            </div>
            <div class="p-2.5 rounded-xl bg-slate-800/70 border border-slate-700/70">
              <div class="text-xs text-slate-400">半徑和與半徑差</div>
              <div class="text-sm font-mono font-bold text-sky-300 mt-0.5">r₁+r₂ = ${sumR}, |r₁-r₂| = ${diffR}</div>
            </div>
          `;

          document.getElementById('math-derivation').innerHTML = `
            <div class="p-3 rounded-xl bg-emerald-950/35 border border-emerald-500/30">
              <div class="text-xs text-emerald-300 font-semibold mb-1">1. 外公切線段長公式（平移半徑形成股長 |r₁ - r₂|）：</div>
              <div id="m4-tex-1"></div>
            </div>
            <div class="p-3 rounded-xl bg-amber-950/35 border border-amber-500/30">
              <div class="text-xs text-amber-300 font-semibold mb-1">2. 內公切線段長公式（延伸半徑形成股長 r₁ + r₂）：</div>
              <div id="m4-tex-2"></div>
            </div>
            <div class="p-3 rounded-xl bg-slate-950/80 border border-slate-800">
              <div class="text-xs text-slate-400 mb-1.5">3. 各公切線的長度、斜率與方程式：</div>

            <div class="p-3 rounded-xl bg-purple-950/30 border border-purple-500/30">

              <div id="m4-tex-3"></div>

          const tans = this.getTangents();
          document.getElementById('m4-tan-list').innerHTML = tans.length

                  <span class="${col} font-bold">${t.type}公切線 ${n}</span>
                  <span class="text-slate-200">長 ${MathUtils.fmt(t.len, 2)}</span>
                  <span class="text-sky-300">${t.m === null ? '斜率不存在' : '斜率 ' + MathUtils.fmt(t.m, 2)}</span>
                  <span class="text-slate-400">${t.eq}</span></div>`;
              }).join('')
            : '<div class="text-slate-500">此位置關係沒有公切線</div>';
          const ra = this.getRadical();
          renderKaTeX(document.getElementById('m4-tex-3'), ra ? MathUtils.formatLine(ra.A, ra.B, ra.C, 2) : `\\text{兩圓同心，無根軸}`);

          renderKaTeX(
            document.getElementById('m4-tex-1'),
            `L_{\\text{外}} = \\sqrt{d^2 - (r_1 - r_2)^2} = \\sqrt{${MathUtils.fmt(d, 2)}^2 - ${diffR}^2} = ${extLen}`
          );
          renderKaTeX(
            document.getElementById('m4-tex-2'),
            `L_{\\text{內}} = \\sqrt{d^2 - (r_1 + r_2)^2} = \\sqrt{${MathUtils.fmt(d, 2)}^2 - ${sumR}^2} = ${intLen}`
          );

          document.getElementById('concept-notes').innerHTML = `
            <p>• <strong>口訣記憶</strong>：外公切線段長用<strong>半徑差</strong> $\\sqrt{d^2 - (r_1 - r_2)^2}$，內公切線段長用<strong>半徑和</strong> $\\sqrt{d^2 - (r_1 + r_2)^2}$，斜邊永遠是連心線長 $d$。</p>
            <p>• <strong>存在條件</strong>：當兩圓<strong>外切</strong> ($d = r_1 + r_2$) 時，內公切線段長縮為 $0$；當兩圓<strong>內切</strong> ($d = |r_1 - r_2|$) 時，外公切線段長縮為 $0$。</p>

      // --------------------------------------------------------------------------
      // 模組六：阿波羅尼斯圓（Apollonius' Circle）
      // --------------------------------------------------------------------------
      {
        id: 5,
        shortTitle: '05 阿波羅尼斯圓',
        fullTitle: '阿波羅尼斯圓（Apollonius\' Circle）：距離定比軌跡',
        hint: '拖曳定點 A, B 或軌跡上的動點 P，觀察 PA : PB 恆等於定值 k；將 k 設為 1 則退化為中垂線！',
        defaultState() {
          return {
            ax: -3, ay: 0,
            bx: 2, by: 0,
            k: 2.0,
            psi: 1.0, // angle on circle or parameter along perpendicular bisector
          };
        },
        state: null,
        init() {
          this.state = this.defaultState();
        },
        reset() {
          this.state = this.defaultState();
        },
        getLocusInfo() {
          const { ax, ay, bx, by, k } = this.state;
          const ab = MathUtils.dist(ax, ay, bx, by);
          if (Math.abs(k - 1) < 1e-4) {
            // Perpendicular bisector: 2(bx - ax)x + 2(by - ay)y + (ax^2 + ay^2 - bx^2 - by^2) = 0
            return {
              isLine: true,
              A: 2 * (bx - ax),
              B: 2 * (by - ay),
              C: ax * ax + ay * ay - bx * bx - by * by,
              ab,
            };
          }
          const denom = 1 - k * k;
          const hk = (ax - k * k * bx) / denom;
          const kk = (ay - k * k * by) / denom;
          const rk = (k * ab) / Math.abs(denom);
          return {
            isLine: false,
            hk,
            kk,
            rk,
            ab,
          };
        },
        // 讓動點 P 落在 AB 附近可視範圍（k 接近 1 時圓半徑很大，原角度會讓 P 跑出畫面）
        focusP() {
          const info = this.getLocusInfo();
          if (info.isLine) { this.state.psi = 2.5; return; }
          if (info.rk < 1e-6) return;
          const { ax, ay, bx, by } = this.state;
          const base = Math.atan2((ay + by) / 2 - info.kk, (ax + bx) / 2 - info.hk);
          this.state.psi = base + Math.min(1.2, 3 / info.rk);
        },
        getPointPOnLocus() {
          const { ax, ay, bx, by, psi } = this.state;
          const info = this.getLocusInfo();
          if (info.isLine) {
            const mx = (ax + bx) / 2;
            const my = (ay + by) / 2;
            const ab = Math.max(1e-5, info.ab);
            const nx = -(by - ay) / ab;
            const ny = (bx - ax) / ab;
            return { x: mx + psi * nx, y: my + psi * ny };
          }
          return {
            x: info.hk + info.rk * Math.cos(psi),
            y: info.kk + info.rk * Math.sin(psi),
          };
        },
        getDraggablePoints() {
          const P = this.getPointPOnLocus();
          return [
            { id: 'A', x: this.state.ax, y: this.state.ay },
            { id: 'B', x: this.state.bx, y: this.state.by },
            { id: 'P', x: P.x, y: P.y },
          ];
        },
        onDragPoint(id, wx, wy) {
          if (id === 'A') {
            this.state.ax = Math.round(wx * 10) / 10;
            this.state.ay = Math.round(wy * 10) / 10;
          } else if (id === 'B') {
            this.state.bx = Math.round(wx * 10) / 10;
            this.state.by = Math.round(wy * 10) / 10;
          } else if (id === 'P') {
            const info = this.getLocusInfo();
            if (info.isLine) {
              const { ax, ay, bx, by } = this.state;
              const mx = (ax + bx) / 2;
              const my = (ay + by) / 2;
              const ab = Math.max(1e-5, info.ab);
              const nx = -(by - ay) / ab;
              const ny = (bx - ax) / ab;
              this.state.psi = Math.max(-7, Math.min(7, (wx - mx) * nx + (wy - my) * ny));
            } else {
              this.state.psi = Math.atan2(wy - info.kk, wx - info.hk);
            }
          }
        },
        renderControls(container, onUpdate) {
          const s = this.state;
          container.innerHTML = `
            <div class="p-3 rounded-xl bg-slate-950/70 border border-slate-800 space-y-2">
              <div class="flex justify-between items-center text-xs">
                <span class="font-semibold text-sky-300">距離比值 k = PA / PB ∈ [0.2, 4.0]</span>
                <span class="font-mono font-bold text-sky-300 text-sm" id="m6-val-k">${s.k.toFixed(2)}</span>
              </div>
              <input type="range" id="m6-k" min="0.2" max="4.0" step="0.05" value="${s.k}" class="w-full" />
              <div class="flex flex-wrap gap-2 pt-1">
                <button id="m6-set-1" class="px-3 py-1.5 rounded-lg bg-amber-500/25 hover:bg-amber-500/40 text-amber-200 border border-amber-500/50 text-xs font-semibold transition">
                  🎯 設為 k = 1（退化為中垂線）
                </button>
                <button id="m6-set-2" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs transition">
                  k = 2.0
                </button>
                <button id="m6-set-half" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs transition">
                  k = 0.5
                </button>
              </div>
            </div>
          `;

          const kSlider = document.getElementById('m6-k');
          kSlider.addEventListener('input', (e) => {
            let v = parseFloat(e.target.value);
            if (Math.abs(v - 1) < 0.04) {
              v = 1.0;
              kSlider.value = 1.0;
            }
            this.state.k = v;
            this.focusP();
            document.getElementById('m6-val-k').textContent = v.toFixed(2);
            onUpdate();
          });

          document.getElementById('m6-set-1').addEventListener('click', () => {
            this.state.k = 1.0;
            this.state.psi = 2.5;
            kSlider.value = 1.0;
            document.getElementById('m6-val-k').textContent = '1.00';
            onUpdate();
          });
          document.getElementById('m6-set-2').addEventListener('click', () => {
            this.state.k = 2.0;
            this.focusP();
            kSlider.value = 2.0;
            document.getElementById('m6-val-k').textContent = '2.00';
            onUpdate();
          });
          document.getElementById('m6-set-half').addEventListener('click', () => {
            this.state.k = 0.5;
            this.focusP();
            kSlider.value = 0.5;
            document.getElementById('m6-val-k').textContent = '0.50';
            onUpdate();
          });
        },
        render(vp) {
          const { ax, ay, bx, by, k } = this.state;
          vp.clear();
          vp.drawGrid();

          // Segment AB
          vp.drawSegment(ax, ay, bx, by, { color: 'rgba(148, 163, 184, 0.45)', dashed: true, lineWidth: 1.4 });

          const info = this.getLocusInfo();
          if (info.isLine) {
            vp.drawInfiniteLine(info.A, info.B, info.C, {
              color: '#fbbf24',
              lineWidth: 2.8,
              label: 'k = 1 退化為 AB 中垂線',
            });
          } else {
            vp.drawCircle(info.hk, info.kk, info.rk, {
              color: '#38bdf8',
              fill: 'rgba(56, 189, 248, 0.06)',
              lineWidth: 2.6,
            });
            vp.drawPoint(info.hk, info.kk, { color: '#38bdf8', radius: 3.5, label: '軌跡圓心', offsetY: 14 });
          }

          // Movable point P on locus & segments PA, PB
          const P = this.getPointPOnLocus();
          const pa = MathUtils.dist(P.x, P.y, ax, ay);
          const pb = MathUtils.dist(P.x, P.y, bx, by);

          vp.drawSegment(P.x, P.y, ax, ay, { color: '#34d399', dashed: true, lineWidth: 2, label: `PA=${MathUtils.fmt(pa, 2)}` });
          vp.drawSegment(P.x, P.y, bx, by, { color: '#f472b6', dashed: true, lineWidth: 2, label: `PB=${MathUtils.fmt(pb, 2)}` });

          vp.drawPoint(ax, ay, { color: '#34d399', draggable: true, label: `A(${MathUtils.fmt(ax, 1)}, ${MathUtils.fmt(ay, 1)})`, offsetY: 16 });
          vp.drawPoint(bx, by, { color: '#f472b6', draggable: true, label: `B(${MathUtils.fmt(bx, 1)}, ${MathUtils.fmt(by, 1)})`, offsetY: 16 });
          vp.drawPoint(P.x, P.y, {
            color: '#fbbf24',
            haloColor: 'rgba(251, 191, 36, 0.3)',
            draggable: true,
            label: `動點 P (PA/PB = ${pb > 1e-5 ? MathUtils.fmt(pa / pb, 2) : k.toFixed(2)})`,
          });

          document.getElementById('canvas-legend').innerHTML = `
            <span class="px-2 py-0.5 rounded bg-slate-900/90 border border-sky-500/40 text-sky-300">━━ ${info.isLine ? '黃線：k=1 時退化為線段 AB 中垂線' : '藍圓：阿波羅尼斯圓軌跡'}</span>
            <span class="px-2 py-0.5 rounded bg-slate-900/90 border border-amber-500/40 text-amber-300">● 拖曳動點 P 驗證 PA : PB 恆等於 ${k.toFixed(2)}</span>
          `;
        },
        updateDashboard() {
          const { ax, ay, bx, by, k } = this.state;
          const info = this.getLocusInfo();
          const P = this.getPointPOnLocus();
          const pa = MathUtils.dist(P.x, P.y, ax, ay);
          const pb = MathUtils.dist(P.x, P.y, bx, by);

          const statusPill = document.getElementById('status-pill');
          document.getElementById('alert-banner').classList.add('hidden');
          if (info.isLine) {
            statusPill.className = 'px-2.5 py-1 rounded-full text-xs font-bold bg-amber-500/25 text-amber-200 border border-amber-500/50';
            statusPill.textContent = 'k = 1 → 退化為中垂線（半徑 → ∞）';
          } else {
            statusPill.className = 'px-2.5 py-1 rounded-full text-xs font-semibold bg-sky-500/20 text-sky-300 border border-sky-500/40';
            statusPill.textContent = `阿波羅尼斯圓 (半徑 R = ${MathUtils.fmt(info.rk, 2)})`;
          }

          document.getElementById('metrics-grid').innerHTML = `
            <div class="p-2.5 rounded-xl bg-slate-800/70 border border-slate-700/70">
              <div class="text-xs text-slate-400">即時線段長 PA 與 PB</div>
              <div class="text-sm font-mono font-bold text-white mt-0.5">PA = ${MathUtils.fmt(pa, 2)}, PB = ${MathUtils.fmt(pb, 2)}</div>
            </div>
            <div class="p-2.5 rounded-xl bg-slate-800/70 border border-slate-700/70">
              <div class="text-xs text-slate-400">即時比值 PA / PB</div>
              <div class="text-base font-mono font-bold text-amber-300 mt-0.5">${pb > 1e-5 ? MathUtils.fmt(pa / pb, 3) : k.toFixed(3)} (設定 k = ${k.toFixed(2)})</div>
            </div>
          `;

          document.getElementById('math-derivation').innerHTML = `
            <div class="p-3 rounded-xl bg-slate-950/80 border border-slate-800">
              <div class="text-xs text-slate-400 mb-1">1. 軌跡定義式 PA = k · PB 兩邊平方：</div>
              <div id="m6-tex-1"></div>
            </div>
            <div class="p-3 rounded-xl bg-sky-950/40 border border-sky-500/30">
              <div class="text-xs text-sky-300 font-semibold mb-1">2. 化簡後軌跡方程式：</div>
              <div id="m6-tex-2"></div>
            </div>
          `;

          renderKaTeX(
            document.getElementById('m6-tex-1'),
            `(x - x_A)^2 + (y - y_A)^2 = ${k.toFixed(2)}^2\\left[(x - x_B)^2 + (y - y_B)^2\\right]`
          );
          if (info.isLine) {
            renderKaTeX(
              document.getElementById('m6-tex-2'),
              `\\text{中垂線：} ${MathUtils.formatLine(info.A, info.B, info.C, 2)}`
            );
          } else {
            renderKaTeX(
              document.getElementById('m6-tex-2'),
              `${MathUtils.shiftVar('x', info.hk)}^2 + ${MathUtils.shiftVar('y', info.kk)}^2 = ${MathUtils.fmt(info.rk, 2)}^2`
            );
          }

          document.getElementById('concept-notes').innerHTML = `
            <p>• <strong>幾何快速作圖法（內外分點定直徑）</strong>：直線 $AB$ 上滿足 $\\overline{PA}:\\overline{PB} = k$ 的<strong>內分點 $M$</strong> 與<strong>外分點 $N$</strong>，恰為阿波羅尼斯圓的<strong>直徑兩端點</strong>（因內外角平分線互相垂直 $\\angle MPN = 90^\\circ$）。</p>
          `;
          renderInlineMath(document.getElementById('concept-notes'));
        },

    ];

    /**
     * ============================================================================
     * 主應用程式控制器 (Main Application Controller)
     * ============================================================================
     */
    const App = {
      currentIndex: 0,
      vpMain: null,
      draggingPointId: null,
      activeVp: null, // 目前正在拖曳 / 平移的畫布（避免兩個畫布的 window 監聽互相覆蓋）
      isPanning: false,
      lastPointer: { x: 0, y: 0 },

      init() {
        Modules.forEach((m) => m.init());

        this.vpMain = new CoordinateViewport(document.getElementById('main-canvas'));

        this.renderTabs();
        this.bindCanvasEvents(this.vpMain);
        this.bindGlobalButtons();

        window.addEventListener('resize', () => this.handleResize());
        this.selectModule(0);

      },

      renderTabs() {
        const tabsContainer = document.getElementById('module-tabs');
        tabsContainer.innerHTML = Modules.map(
          (m, idx) => `
          <button
            data-idx="${idx}"
            class="module-tab shrink-0 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition border ${
              idx === this.currentIndex
                ? 'bg-sky-500 text-slate-950 border-sky-400 shadow-md shadow-sky-500/25'
                : 'bg-slate-800/70 text-slate-300 border-slate-700/80 hover:bg-slate-800 hover:text-white'
            }"
          >
            ${m.shortTitle}
          </button>
        `
        ).join('');

        tabsContainer.querySelectorAll('.module-tab').forEach((btn) => {
          btn.addEventListener('click', () => {
            this.selectModule(parseInt(btn.dataset.idx, 10));
          });
        });
      },

      selectModule(index) {
        this.currentIndex = index;
        this.draggingPointId = null;
        this.renderTabs();

        const mod = Modules[index];
        document.getElementById('btn-zoom-reset').textContent = `${Math.round(this.vpMain.zoom * 100)}%`;
        document.getElementById('canvas-badge').textContent = mod.fullTitle;
        document.getElementById('canvas-hint').textContent = mod.hint;

        mod.renderControls(document.getElementById('controls-panel'), () => this.renderCurrent());
        this.handleResize();
      },

      handleResize() {
        const mod = Modules[this.currentIndex];
        this.vpMain.resize();
        this.renderCurrent();
      },

      renderCurrent(skipDashboard = false) {
        const mod = Modules[this.currentIndex];
        mod.render(this.vpMain);
        if (!skipDashboard) mod.updateDashboard();
      },

      bindCanvasEvents(vp) {
        const canvas = vp.canvas;

        const getPos = (e) => {
          const rect = canvas.getBoundingClientRect();
          const clientX = e.touches ? e.touches[0].clientX : e.clientX;
          const clientY = e.touches ? e.touches[0].clientY : e.clientY;
          return { x: clientX - rect.left, y: clientY - rect.top };
        };

        const onDown = (e) => {
          this.activeVp = vp;
          const pos = getPos(e);
          const mod = Modules[this.currentIndex];
          const points = mod.getDraggablePoints();
          let hitId = null;
          let minDist = 26; // generous touch/mouse hit radius in px

          points.forEach((pt) => {
            const sp = vp.toScreen(pt.x, pt.y);
            const d = Math.hypot(sp.x - pos.x, sp.y - pos.y);
            if (d < minDist) {
              minDist = d;
              hitId = pt.id;
            }
          });

          if (hitId) {
            this.draggingPointId = hitId;
            canvas.style.cursor = 'grabbing';
          } else {
            this.isPanning = true;
            this.lastPointer = pos;
            canvas.style.cursor = 'move';
          }
        };

        const onMove = (e) => {
          const busy = this.draggingPointId || this.isPanning;
          if (busy && this.activeVp !== vp) return;                       // 別的畫布正在操作
          if (!busy && e.type === 'mousemove' && e.target !== canvas) return; // 游標不在此畫布上
          const pos = getPos(e);
          const world = vp.toWorld(pos.x, pos.y);
          const coordsEl = document.getElementById('cursor-coords');
          if (coordsEl) {
            coordsEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span><span>游標座標：(${MathUtils.fmt(world.x, 1)}, ${MathUtils.fmt(world.y, 1)})</span>`;
          }

          const mod = Modules[this.currentIndex];
          if (this.draggingPointId) {
            e.preventDefault();
            mod.onDragPoint(this.draggingPointId, world.x, world.y);
            this.renderCurrent();
          } else if (this.isPanning) {
            e.preventDefault();
            vp.panX += pos.x - this.lastPointer.x;
            vp.panY += pos.y - this.lastPointer.y;
            this.lastPointer = pos;
            this.renderCurrent();
          } else {
            // Hover cursor feedback
            const points = mod.getDraggablePoints();
            const hovering = points.some((pt) => {
              const sp = vp.toScreen(pt.x, pt.y);
              return Math.hypot(sp.x - pos.x, sp.y - pos.y) < 22;
            });
            canvas.style.cursor = hovering ? 'grab' : 'crosshair';
          }
        };

        const onUp = () => {
          if (this.activeVp && this.activeVp !== vp) return;
          this.activeVp = null;
          this.draggingPointId = null;
          this.isPanning = false;
          canvas.style.cursor = 'crosshair';
        };

        canvas.addEventListener('mousedown', onDown);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onUp);

        canvas.addEventListener('touchstart', onDown, { passive: false });
        canvas.addEventListener('touchmove', onMove, { passive: false });
        canvas.addEventListener('touchend', onUp);
        canvas.addEventListener('touchcancel', onUp);
      },

      bindGlobalButtons() {
        document.getElementById('btn-reset-module').addEventListener('click', () => {
          const mod = Modules[this.currentIndex];
          mod.reset();
          this.vpMain.resetView();
          document.getElementById('btn-zoom-reset').textContent = '100%';
          mod.renderControls(document.getElementById('controls-panel'), () => this.renderCurrent());
          this.renderCurrent();
        });

        const updateZoomLabel = (vp) => {
          document.getElementById('btn-zoom-reset').textContent = `${Math.round(vp.zoom * 100)}%`;
        };

        document.getElementById('btn-zoom-in').addEventListener('click', () => {
          const vp = this.vpMain;
          vp.zoom = Math.min(2.5, vp.zoom + 0.15);
          updateZoomLabel(vp);
          this.renderCurrent();
        });

        document.getElementById('btn-zoom-out').addEventListener('click', () => {
          const vp = this.vpMain;
          vp.zoom = Math.max(0.5, vp.zoom - 0.15);
          updateZoomLabel(vp);
          this.renderCurrent();
        });

        document.getElementById('btn-zoom-reset').addEventListener('click', () => {
          const vp = this.vpMain;
          vp.resetView();
          updateZoomLabel(vp);
          this.renderCurrent();
        });
      },
    };

    window.addEventListener('DOMContentLoaded', () => {
      App.init();
    });
  </script>
</body>
</html>
